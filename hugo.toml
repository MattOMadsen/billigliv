baseURL = "https://billigliv.dk/"
languageCode = "da-dk"
title = "BilligLiv.dk – Spar 8.000 kr om året"
theme = "PaperMod"

[permalinks]
  posts = "/:slug/"

[params]
  description = "Ærlige sparetips 2026 til almindelige danske familier. Opsparing, madplan, forsikring, strøm og abonnementer."
  author = "Mattie Danmark"
  defaultTheme = "light"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  homeInfoParams = { Title = "Spar penge – hver eneste måned", Content = "Velkommen til BilligLiv.dk. Praktiske tips der virker i virkeligheden – ingen pis." }

[markup.goldmark.renderer]
  unsafe = true

