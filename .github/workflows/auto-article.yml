name: Auto Generate BilligLiv Artikel

on:
  schedule:
    - cron: '0 8 * * 1,4'   # Mandag + torsdag kl. 9:00 dansk tid (8:00 UTC)
  workflow_dispatch:        # Kan køres manuelt til test

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install xmltodict requests

      - name: Hent nyeste godkendte programmer fra Partner-Ads (stærk retry)
        run: |
          echo "Forsøger at hente XML fra Partner-Ads..."
          rm -f programs.xml
          
          for i in {1..8}; do
            curl -s -o programs.xml "https://www.partner-ads.com/dk/programoversigt_xml.php?key=${{ secrets.PARTNER_ADS_KEY }}&godkendte=1"
            
            if [ -s programs.xml ] && grep -q "<?xml" programs.xml; then
              echo "✅ XML hentet succesfuldt på forsøg $i"
              break
            elif grep -q "Data should not be retrieved so frequently" programs.xml; then
              echo "Rate limit på forsøg $i - venter 75 sekunder..."
              sleep 75
            else
              echo "Ukendt fejl på forsøg $i - venter 45 sekunder..."
              sleep 45
            fi
          done

          # Sidste sikkerhedstjek
          if [ ! -s programs.xml ] || ! grep -q "<?xml" programs.xml; then
            echo "FEJL: Kunne ikke hente XML efter 8 forsøg"
            cat programs.xml
            exit 1
          fi

          echo "XML størrelse: $(wc -c < programs.xml) bytes"
          head -c 300 programs.xml | cat

      - name: Generér artikel + billeder + PR
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python .github/scripts/generate-article.py

      - name: Opret Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto: Ny artikel genereret ${{ env.TODAY }}"
          title: "Auto: ${{ env.TOPIC }} 2026 – ny spareartikel"
          body: |
            Ny artikel genereret automatisk.
            Emne: ${{ env.TOPIC }}
            Programmer: ${{ env.SELECTED_PROGRAMS }}
            Merge med ét klik når du har tjekket billederne (Grok Imagine prompts er i filen).
          branch: auto-article-${{ env.TODAY }}
          delete-branch: true
