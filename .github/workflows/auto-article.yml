name: Auto Generate BilligLiv Artikel (Improved v3.2)

on:
  schedule:
    - cron: '0 8 * * 1,4'  # Mandag + torsdag kl. 9:00 DK
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install xmltodict requests openai pillow

      - name: Hent XML med stærk retry & logging
        run: |
          echo \"Henter Partner-Ads XML...\"
          rm -f programs.xml
          for i in {1..8}; do
            curl -s -o programs.xml \"https://www.partner-ads.com/dk/programoversigt_xml.php?key=${{ secrets.PARTNER_ADS_KEY }}&godkendte=1\"
            size=$(wc -c < programs.xml)
            echo \"Forsøg $i: Størrelse $size bytes\"
            if [ $size -gt 1000 ] && grep -q \"<?xml\" programs.xml; then
              echo \"✅ Succes!\"
              head -300 programs.xml >> logs.xml
              break
            fi
            sleep $(( 75 * i ))
          done
          if [ ! -s programs.xml ]; then
            echo \"FEJL: XML tom\"
            exit 1
          fi

      - name: Generér artikel + billeder
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python .github/scripts/generate-article.py

      - name: Opret PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: \"Auto: Ny artikel ${{ env.TODAY }}\"
          title: \"Auto: ${{ env.TOPIC }} 2026\"
          body: |
            Ny artikel.
            Programmer: ${{ env.PROGRAMS }}
            Billeder: Grok Imagine.
          branch: auto-${{ env.TODAY }}
          delete-branch: true